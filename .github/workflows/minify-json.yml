name: Minify-JSON
on: workflow_dispatch
#on:
#  push:
#    branches:
#    - main
#    paths:
#    - '**.json'
#    - '!**/minified/*.json'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96

      - name: Create matrix
        id: matrix
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          for file2 in ${CHANGED_FILES}; do
            file=EO2/test.json
            case $file in *.json)
              echo "value=[\"path\"=\"$file\", \"dir\"=\"${file%/*}\", \"dirmin\"=\"${file%/*}/minified\", \"file\"=\"${file##*/}\"]" >> $GITHUB_OUTPUT
              ;;
            esac
          done

  build:
    needs: [ setup ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        value: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: debug
        run: |
          echo ${{ matrix.value }}
          echo ${{ matrix.value.path }}
          echo ${{ matrix.value.dir }}
          echo ${{ matrix.value.dirmin }}
          echo ${{ matrix.value.file }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Create folder
        run: |
          if [ ! -d "${{ matrix.value.dirmin }}" ]; then
            mkdir -p "${{ matrix.value.dirmin }}"
            echo "created folder: ${{ matrix.value.dirmin }}"
          fi

      - name: Minify JSON
        uses: StefanEnsmann/Minify-JSON-Action@1.1.0
        with:
          input_file: "${{ matrix.value.path }}"
          output_file: "${{ matrix.value.dirmin }}${{ matrix.value.file }}"

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[bot] auto-minify"
