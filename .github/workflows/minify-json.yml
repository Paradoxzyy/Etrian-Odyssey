name: Minify JSON
on:
  workflow_call:
  #push:
  #  branches:
  #  - main
  #  paths:
  #  - '**.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: "**.json"
          matrix: "true"
          output_renamed_files_as_deleted_and_added: "true"

      - name: Minify JSON
        if: ${{ (steps.changed-files.outputs.any_changed == 'true') || (steps.changed-files.outputs.any_deleted == 'true') }}
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          DELETED_FILES: ${{ steps.changed-files.outputs.deleted_files }}
        uses: Paradoxzyy/Minify-JSON-Action@1.3.0
        with:
          changed_files: $ALL_CHANGED_FILES
          deleted_files: $DELETED_FILES
          prefix: "minified/"
          #suffix: "-min"

      - name: Commit
        if: ${{ (steps.changed-files.outputs.any_changed == 'true') || (steps.changed-files.outputs.any_deleted == 'true') }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[bot] auto-minify"
          push_options: "--force"
